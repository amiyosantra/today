<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1030">
<title>Happy Birthday 🎂</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="view" id="view">
  <div class="stage" id="stage">
    <div class="world" id="world">
      <div class="wall"></div>
      <div class="bunting" id="bunting"></div>
      <div class="balloons" id="balloons"></div>

      <div class="slot him" id="him"></div>
      <div class="slot her" id="her"></div>

      <div class="table"></div>

      <div class="cake-wrap">
        <svg class="cake" id="cake" viewBox="0 0 300 260" aria-label="Birthday cake">
          <defs>
            <linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#f58fb5"/><stop offset=".45" stop-color="#ffc2d8"/><stop offset="1" stop-color="#e86f9e"/></linearGradient>
            <linearGradient id="g2" x1="0" x2="1"><stop offset="0" stop-color="#c9a0f0"/><stop offset=".45" stop-color="#ecdcff"/><stop offset="1" stop-color="#b184e0"/></linearGradient>
            <radialGradient id="fl" cx=".5" cy=".7" r=".6"><stop offset="0" stop-color="#fff8b8"/><stop offset=".5" stop-color="#ffb52f"/><stop offset="1" stop-color="#ff642e"/></radialGradient>
          </defs>
          <ellipse cx="150" cy="238" rx="142" ry="20" fill="#cdbfe3"/>
          <ellipse cx="150" cy="231" rx="136" ry="17" fill="#fff"/>
          <path d="M42 150v68a108 22 0 0 0 216 0v-68z" fill="url(#g1)"/>
          <ellipse cx="150" cy="150" rx="108" ry="24" fill="#ffe6ef"/>
          <path id="cutw" class="cutw" d="M156 168L206 162L202 220L152 226Z" fill="#f6d9a8" stroke="#e0a766" stroke-width="2"/>
          <path d="M82 104v46a68 15 0 0 0 136 0v-46z" fill="url(#g2)"/>
          <ellipse cx="150" cy="104" rx="68" ry="15" fill="#fbeeff"/>
          <g fill="#fff" stroke="#f0b6cb" stroke-width="2"><circle cx="70" cy="176" r="6"/><circle cx="110" cy="188" r="6"/><circle cx="190" cy="190" r="6"/><circle cx="232" cy="176" r="6"/></g>
          <g class="candles">
            <rect x="115" y="66" width="10" height="38" rx="3" fill="#fff" stroke="#ff8fb1" stroke-width="2"/>
            <rect x="145" y="62" width="10" height="42" rx="3" fill="#fff" stroke="#ffd98a" stroke-width="2"/>
            <rect x="175" y="66" width="10" height="38" rx="3" fill="#fff" stroke="#ff8fb1" stroke-width="2"/>
            <g class="flames">
              <g transform="translate(120 66)"><path class="flame" d="M0 -24Q10 -10 0 0Q-10 -10 0 -24Z" fill="url(#fl)"/></g>
              <g transform="translate(150 62)"><path class="flame" d="M0 -24Q10 -10 0 0Q-10 -10 0 -24Z" fill="url(#fl)"/></g>
              <g transform="translate(180 66)"><path class="flame" d="M0 -24Q10 -10 0 0Q-10 -10 0 -24Z" fill="url(#fl)"/></g>
            </g>
          </g>
        </svg>
        <svg class="knife" id="knife" viewBox="0 0 40 170" aria-hidden="true">
          <rect x="11" y="0" width="18" height="50" rx="8" fill="#8a5a3a"/>
          <path d="M13 50H29V148L13 166Z" fill="#e9eef5" stroke="#9aa5b5" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
  </div>
</div>

<p id="hint" class="hint">Tap anywhere ♥</p>
<button id="musicBtn" class="round music" type="button" aria-label="Toggle music">♫</button>
<button id="replay" class="replay" type="button" hidden>↻ Celebrate again</button>
<div id="fx" aria-hidden="true"></div>
<div id="fly" aria-hidden="true"></div>

<script src="script.js"></script>
</body>
</html>
